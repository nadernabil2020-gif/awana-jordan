<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f3f7f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Awana Jordan">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Awana Jordan – أندية أوانا الأردن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap">
<style>
/* Awana world colors: blue, green, yellow, red. Rounded, playful kids-club feel. */
/* Layout: sticky header + breadcrumb, home = stats strip + club roster; club = profile header with tabs (overview / leaders / kids / weeks); week = attendance + photo album */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eaeef4; --line:#d6dde7;
  --ink:#14233a; --muted:#5b6b82; --accent:#f7b500; --accent-ink:#3a2700; --accent-soft:#fff1c7;
  --brand:#1f3f7f; --brand-soft:#e1e9f8; --ok:#2e9a3a; --ok-soft:#ddf3df; --danger:#d7322a; --danger-soft:#fbe1df;
  --a-blue:#1f5fbf; --a-green:#33a23f; --a-yellow:#f7b500; --a-red:#e0352b;
  --a-blue-s:#e1ebfb; --a-green-s:#e0f4e2; --a-yellow-s:#fff1c7; --a-red-s:#fde2df;
  --shadow:0 1px 2px rgba(20,35,58,.06),0 4px 14px rgba(20,35,58,.06);
  --f-display:"Lalezar","Baloo Bhaijaan 2",system-ui,sans-serif;
  --f-body:"Baloo Bhaijaan 2",system-ui,"Segoe UI",Tahoma,sans-serif;
  --p-puggles:#0e9aa7; --p-cubbies:#1f5fbf; --p-sparks:#e0352b; --p-tt:#33a23f; --p-trek:#d98a00; --p-journey:#7b4bc4;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1622; --surface:#152132; --surface-2:#1c2b40; --line:#2a3b53;
  --ink:#e7edf5; --muted:#97a6bb; --accent:#ffc533; --accent-ink:#2a1c00; --accent-soft:#3a3015;
  --brand:#8db6f2; --brand-soft:#1e3352; --ok:#5cc866; --ok-soft:#183a1d; --danger:#f2786e; --danger-soft:#3e1f1c;
  --a-blue:#6aa0f0; --a-green:#5cc866; --a-yellow:#ffc533; --a-red:#f2786e;
  --a-blue-s:#1b2f4f; --a-green-s:#173520; --a-yellow-s:#3a3015; --a-red-s:#3f1f1d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --p-puggles:#3cc3cf; --p-cubbies:#6a9ff0; --p-sparks:#f06b61; --p-tt:#52c27f; --p-trek:#f39a3d; --p-journey:#a786e0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1622; --surface:#152132; --surface-2:#1c2b40; --line:#2a3b53;
  --ink:#e7edf5; --muted:#97a6bb; --accent:#ffc533; --accent-ink:#2a1c00; --accent-soft:#3a3015;
  --brand:#8db6f2; --brand-soft:#1e3352; --ok:#5cc866; --ok-soft:#183a1d; --danger:#f2786e; --danger-soft:#3e1f1c;
  --a-blue:#6aa0f0; --a-green:#5cc866; --a-yellow:#ffc533; --a-red:#f2786e;
  --a-blue-s:#1b2f4f; --a-green-s:#173520; --a-yellow-s:#3a3015; --a-red-s:#3f1f1d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --p-puggles:#3cc3cf; --p-cubbies:#6a9ff0; --p-sparks:#f06b61; --p-tt:#52c27f; --p-trek:#f39a3d; --p-journey:#a786e0;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 64px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#1f3f7f;color:#fff;box-shadow:var(--shadow)}
.band{display:grid;grid-template-columns:repeat(4,1fr);height:6px}
.band i:nth-child(1){background:var(--a-blue)}.band i:nth-child(2){background:var(--a-green)}.band i:nth-child(3){background:var(--a-yellow)}.band i:nth-child(4){background:var(--a-red)}
.logo-img{height:34px;width:auto;display:block}
.logo-jo{font-family:var(--f-display);font-size:20px;line-height:1;background:var(--a-yellow);color:#3a2700;padding:5px 10px 3px;border-radius:99px}

:root .top{--hdr-ink:#fff}
.top-in{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0;color:inherit}
.logo-mark{width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:22px;line-height:1}
.logo-t{font-family:var(--f-display);font-size:24px;line-height:1;letter-spacing:.5px}
.logo-s{font-size:12px;opacity:.8}
.top .sp{flex:1}
.role{font-size:12px;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:99px;white-space:nowrap}

.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);padding-block:14px 4px}
.crumbs button{background:none;border:0;padding:0;color:var(--brand);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);padding:7px 16px;border-radius:99px;cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--a-yellow);border-color:var(--a-yellow);color:#3a2700;box-shadow:0 3px 0 #c98f00}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.card-btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
svg.i{width:18px;height:18px;flex:none}

/* home */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:18px 8px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,5.5vw,44px);color:var(--brand)}
.hero h1 .w1{color:var(--a-blue)}.hero h1 .w2{color:var(--a-green)}.hero h1 .w3{color:var(--a-red)}
.hero p{margin:4px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-block:14px}
.stat{background:var(--c-s);border-radius:20px;padding:14px 16px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;background:var(--c);opacity:.18;inset-inline-end:-18px;top:-18px}
.stat b{color:var(--c)}
.stat:nth-child(1){--c:var(--a-blue);--c-s:var(--a-blue-s)}.stat:nth-child(2){--c:var(--a-green);--c-s:var(--a-green-s)}
.stat:nth-child(3){--c:#b07f00;--c-s:var(--a-yellow-s)}.stat:nth-child(4){--c:var(--a-red);--c-s:var(--a-red-s)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stat:nth-child(3){--c:var(--a-yellow)}}
:root[data-theme="dark"] .stat:nth-child(3){--c:var(--a-yellow)}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-block:10px}
.search{flex:1 1 220px;min-width:0;position:relative}
.search input{width:100%;padding-block:9px;padding-inline:38px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.search svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--a-blue);color:#fff;border-color:var(--a-blue)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card-btn{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;cursor:pointer;min-width:0;transition:border-color .15s,transform .15s}
.card-btn:hover{border-color:var(--a-blue);transform:translateY(-2px);box-shadow:var(--shadow)}
.club-head{display:flex;gap:12px;align-items:center;min-width:0}
.avatar{width:52px;height:52px;border-radius:16px;background:var(--av,var(--a-blue));color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-size:24px;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;background:var(--surface)}
.avatar.logo{background:#fff;border:1px solid var(--line)}.avatar.logo img{object-fit:contain;padding:4px;background:#fff}
.avatar.c0{--av:var(--a-blue)}.avatar.c1{--av:var(--a-green)}.avatar.c2{--av:#e0a000}.avatar.c3{--av:var(--a-red)}
.avatar.round{border-radius:50%}
.avatar.lg{width:84px;height:84px;font-size:36px;border-radius:20px}
.club-head h3{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.type-pill{display:inline-block;font-size:12px;font-weight:700;padding:1px 10px;border-radius:99px;background:var(--a-green-s);color:var(--ink)}
.club-nums{display:flex;gap:16px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px;color:var(--muted)}
.club-nums b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:15px}
.prog-dots{display:flex;flex-wrap:wrap;gap:4px}
.pg{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:1px 8px 1px 9px;border-radius:99px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.pg::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}

/* empty */
.empty{border:2px dashed var(--line);border-radius:16px;padding:32px 18px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty h3{color:var(--ink);font-size:18px}
.empty p{margin:0;max-width:46ch}

/* club page */
.profile{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding-block:10px 4px}
.profile .txt{flex:1 1 260px;min-width:0}
.profile h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4.5vw,36px);color:var(--brand);overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-block:14px 16px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tc,var(--a-yellow))}
.tab:nth-child(1){--tc:var(--a-blue)}.tab:nth-child(2){--tc:var(--a-green)}.tab:nth-child(3){--tc:var(--a-yellow)}.tab:nth-child(4){--tc:var(--a-red)}
.tab .n{font-size:12px;background:var(--surface-2);border-radius:99px;padding:0 7px;margin-inline-start:4px;font-variant-numeric:tabular-nums}

.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;min-width:0}
.panel h2{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:10px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;margin:0}
.kv dt{color:var(--muted);font-size:13px;white-space:nowrap}
.kv dd{margin:0;overflow-wrap:anywhere}
.sel{user-select:all}
.note{white-space:pre-wrap;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}

.list{display:grid;gap:8px}
.row{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;min-width:0}
.row:hover{border-color:var(--brand)}
.row:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row .grow{flex:1;min-width:0}
.row .name{font-weight:700;overflow-wrap:anywhere}
.row .end{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:12px;color:var(--muted);text-align:end}
.pts{font-family:var(--f-display);font-size:20px;color:var(--a-red);line-height:1;font-variant-numeric:tabular-nums}
.meter{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;width:70px}
.meter i{display:block;height:100%;background:var(--ok)}

.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.wk-cover{aspect-ratio:16/10;max-width:100%;border-radius:12px;background:var(--surface-2);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:13px}
.wk-cover img{width:100%;height:100%;object-fit:cover}
.wk-date{font-family:var(--f-display);font-size:20px;color:var(--a-blue);line-height:1.1}

/* week page */
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.att{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;background:var(--surface);min-width:0}
.att .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}
.att[aria-checked="true"]{border-color:var(--ok);background:var(--ok-soft)}
.att[aria-checked="true"] .box{background:var(--ok);border-color:var(--ok)}
.att span.t{overflow-wrap:anywhere;font-size:14px}
.att:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.att[aria-disabled="true"]{cursor:default}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;max-width:100%;border-radius:12px;overflow:hidden;background:var(--surface-2);border:0;padding:0;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.up{display:grid;place-items:center;color:var(--muted);font-size:13px;cursor:default}
.drop{border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;gap:4px;text-align:center;color:var(--muted);cursor:pointer;aspect-ratio:1;font-size:13px;padding:8px}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--ink)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,18,30,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:18px;width:min(720px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);margin-block:auto}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:18px}
.modal-b{padding:16px 18px;display:grid;gap:16px}
.modal-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--line)}
.fs{border:0;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.fs legend{font-weight:700;font-size:14px;color:var(--brand);padding:0;margin-bottom:8px;grid-column:1/-1}
@media (max-width:560px){.fs{grid-template-columns:minmax(0,1fr)}}
.f{display:grid;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f label,.f .lbl{font-size:13px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.f textarea{min-height:76px;resize:vertical}
.f .checks{display:flex;flex-wrap:wrap;gap:6px}
.f .checks label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--ink);cursor:pointer}
.photo-in{display:flex;align-items:center;gap:10px}
.x{background:none;border:0;cursor:pointer;color:var(--muted);padding:4px;border-radius:8px}
.x:hover{color:var(--ink);background:var(--surface-2)}

/* kid profile */
.kid-top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.kid-top h2{font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--brand)}
.prog-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.prog-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.prog-stats div{background:var(--a-blue-s);border-radius:16px;padding:8px 12px}
.prog-stats div:nth-child(2){background:var(--a-green-s)}.prog-stats div:nth-child(3){background:var(--a-yellow-s)}.prog-stats div:nth-child(4){background:var(--a-red-s)}
.prog-stats b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.prog-stats span{font-size:12px;color:var(--muted)}
.awards{display:flex;flex-wrap:wrap;gap:6px}
.award{background:var(--accent-soft);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(5,9,15,.92);z-index:60;display:grid;grid-template-rows:auto 1fr auto;color:#fff}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;gap:8px}
.lb-top .x{color:#fff}
.lb-img{display:grid;place-items:center;min-height:0;padding:0 8px}
.lb-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lb-nav{display:flex;justify-content:center;gap:12px;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.lb-nav .btn{background:rgba(255,255,255,.12);color:#fff;border-color:transparent}

.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:80;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.banner{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:12px}
.confirm-box{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--danger-soft);border-radius:10px;padding:8px 10px;font-size:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.season{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);background:var(--surface);border:2px solid var(--line);border-radius:99px;padding-block:3px;padding-inline:12px 6px}
.season select{border:0;background:transparent;font-weight:700;color:var(--ink);padding:2px}
.warn{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--danger);background:var(--danger-soft);border-radius:99px;padding:0 8px}
.warn svg.i{width:14px;height:14px}
.warn-line{display:flex;gap:6px;align-items:flex-start;background:var(--danger-soft);color:var(--ink);border-radius:12px;padding:8px 12px;font-size:14px;margin:10px 0 0}
.warn-line svg{color:var(--danger);margin-top:3px}
.ok-pill{font-size:12px;font-weight:700;background:var(--ok-soft);color:var(--ok);border-radius:99px;padding:0 8px}
.sec-h{font-size:18px;margin-top:28px}
.backup{margin-top:28px}
.backup .actions{margin-top:4px}
.grp{font-size:15px;margin:14px 0 6px}
.ptab{display:grid;gap:6px;overflow-x:auto}
.prow{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,52px);gap:6px;align-items:center}
.prow .att{padding:7px 8px}
.prow.phead{font-size:12px;color:var(--muted);font-weight:600}
.prow.phead span:not(:first-child){text-align:center}
.prow .att{width:100%}
.pin{width:100%;padding:7px 4px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.pin::-webkit-inner-spin-button,.pin::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.prow:not(.on) .pin{opacity:.55}
.pin:focus{opacity:1;outline:3px solid var(--accent);outline-offset:1px}
.wlog{display:grid;gap:3px;max-height:220px;overflow-y:auto;font-size:13px}
.wl{display:grid;grid-template-columns:70px 50px minmax(0,1fr);gap:8px;padding:4px 10px;border-radius:8px;background:var(--surface-2);color:var(--muted)}
.wl.on{background:var(--ok-soft);color:var(--ink)}
.radio{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.radio input{margin-top:5px}
.hint{grid-column:1/-1;margin:-4px 0 0}
.lock-note{display:inline-flex;align-items:center;gap:5px}
.lock-note svg{width:15px;height:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.login{display:grid;place-items:center;padding-block:40px}
.login .panel{width:min(420px,100%);display:grid;gap:14px;padding:24px}
.login-h{font-family:var(--f-display);font-weight:400;font-size:34px;text-align:center}
.login-h .w1{color:var(--a-blue)}.login-h .w2{color:var(--a-green)}.login-h .w3{color:var(--a-red)}
.login-f{display:grid;gap:12px}
.login-f .btn{justify-content:center}
.login-who{margin:0;text-align:center;font-weight:700;background:var(--a-yellow-s);border-radius:99px;padding:6px 12px}
.linkbtn{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:0;font:inherit}
img.missing{visibility:hidden}
.role{display:inline-flex;gap:6px;align-items:center;flex:none}
.top-in{flex-wrap:wrap;row-gap:6px}
.top .sp{display:none}
@media (max-width:420px){.logo-img{height:26px}.role{display:inline-flex;font-size:11px}}

.top-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-inline-start:auto}
.tbtn{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:99px;padding:5px 11px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.tbtn:hover{background:rgba(255,255,255,.24)}
.tbtn svg.i{width:16px;height:16px}
.tbtn:focus-visible{outline:3px solid var(--a-yellow);outline-offset:2px}
@media (max-width:520px){.tbtn span{display:none}.tbtn{padding:6px}}
.login-logo{display:block;margin:0 auto;border-radius:22px;box-shadow:var(--shadow)}
.install-cta{justify-content:center}
.install-steps{display:grid;gap:10px}
.istep{display:flex;gap:10px;align-items:center}
.istep b{width:30px;height:30px;border-radius:50%;background:var(--a-blue);color:#fff;display:grid;place-items:center;flex:none;font-family:var(--f-display);font-weight:400;font-size:18px}
.acct h2{flex-wrap:wrap}
.inrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.inrow input{flex:1 1 160px;min-width:0}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;overflow-wrap:anywhere;direction:ltr;unicode-bidi:isolate}
.btn.danger{background:var(--surface)}
